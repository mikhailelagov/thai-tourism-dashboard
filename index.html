<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thailand Tourism Data — Pattaya Dashboard</title>
<style>
  :root{
    --bg:#F5F2EB; --card:#FFFFFF; --soft:#FAF8F2; --inset:#F0ECE2;
    --ink:#1C282A; --muted:#5B6A6C; --faint:#8F9C9D;
    --line:#E4DED1; --line2:#D4CDBC;
    --teal:#11838A; --teal-d:#0A6469; --teal-w:#E2F0F0;
    --coral:#C25139; --amber:#BE8420; --green:#357F5A; --grey:#717E84;
    --sh:0 1px 2px rgba(28,40,42,.05),0 8px 24px rgba(28,40,42,.055);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F1617; --card:#192324; --soft:#151E1F; --inset:#121A1B;
      --ink:#E7EEED; --muted:#93A3A3; --faint:#6C7C7C;
      --line:#253334; --line2:#324142; --teal-w:#12292B;
      --teal:#2DAFB4; --teal-d:#8CDDE0;
      --coral:#DE6C52; --amber:#DAA441; --green:#4AA976; --grey:#849199;
      --sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.36);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F2EB; --card:#FFFFFF; --soft:#FAF8F2; --inset:#F0ECE2;
    --ink:#1C282A; --muted:#5B6A6C; --faint:#8F9C9D;
    --line:#E4DED1; --line2:#D4CDBC; --teal-w:#E2F0F0;
    --teal:#11838A; --teal-d:#0A6469;
    --coral:#C25139; --amber:#BE8420; --green:#357F5A; --grey:#717E84;
    --sh:0 1px 2px rgba(28,40,42,.05),0 8px 24px rgba(28,40,42,.055);
  }
  :root[data-theme="dark"]{
    --bg:#0F1617; --card:#192324; --soft:#151E1F; --inset:#121A1B;
    --ink:#E7EEED; --muted:#93A3A3; --faint:#6C7C7C;
    --line:#253334; --line2:#324142; --teal-w:#12292B;
    --teal:#2DAFB4; --teal-d:#8CDDE0;
    --coral:#DE6C52; --amber:#DAA441; --green:#4AA976; --grey:#849199;
    --sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.36);
  }

  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15.5px;line-height:1.58;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:940px;margin:0 auto;padding:26px 22px 56px;}
  .n{font-variant-numeric:tabular-nums;}

  /* topbar */
  .topbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px;}
  .lang{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--muted);
    font:inherit;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.14s;}
  .lang:hover{color:var(--ink);}
  .lang[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}
  .lang:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  header.top{margin-bottom:22px;}
  .kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);font-weight:700;}
  h1{font-family:var(--serif);font-size:32px;line-height:1.13;margin:8px 0 9px;font-weight:600;
    letter-spacing:-.015em;text-wrap:balance;}
  .lede{font-size:16px;color:var(--muted);max-width:64ch;margin:0;}
  .dateline{font-size:12.5px;color:var(--faint);margin-top:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex-shrink:0;}
  .dot.live{background:var(--green);animation:pulse 2.4s ease-in-out infinite;}
  .dot.err{background:var(--coral);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

  .summary{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px 22px;
    box-shadow:var(--sh);margin-bottom:18px;border-left:3px solid var(--teal);}
  .summary h2{font-size:17.5px;margin:0 0 9px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;}
  .summary p{margin:0 0 10px;color:var(--muted);font-size:15px;max-width:66ch;}
  .summary p:last-child{margin-bottom:0;}
  .summary b{color:var(--ink);font-weight:600;}

  .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px;}
  .fact{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px;box-shadow:var(--sh);}
  .fact .big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05;}
  .fact .lb{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .fact .tagl{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--green);margin-top:6px;}

  h3.sec{font-family:var(--serif);font-size:21px;font-weight:600;margin:34px 0 5px;letter-spacing:-.01em;}
  p.sub{font-size:14px;color:var(--faint);margin:0 0 14px;max-width:64ch;}

  .tabs{display:flex;gap:5px;flex-wrap:wrap;}
  .tab{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--muted);
    font:inherit;font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:9px 9px 0 0;
    cursor:pointer;transition:.14s;border-bottom-color:transparent;}
  .tab:hover{color:var(--ink);background:var(--card);}
  .tab[aria-selected="true"]{background:var(--card);color:var(--teal-d);border-color:var(--line);
    border-bottom-color:var(--card);position:relative;z-index:2;box-shadow:0 -2px 0 var(--teal) inset;}
  .tab:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;}
  .tab i{font-style:normal;font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-left:5px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:0 11px 11px 11px;
    padding:20px 22px;box-shadow:var(--sh);margin-top:-1px;}
  .verdict{display:flex;align-items:flex-start;gap:17px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .vs{flex-shrink:0;text-align:center;min-width:82px;}
  .vs .num{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em;}
  .vs .rail{height:5px;border-radius:3px;background:var(--inset);margin-top:8px;overflow:hidden;}
  .vs .rail>i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.3,1);}
  .vs .cap{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-top:6px;}
  .vt .st{font-size:16.5px;font-weight:700;margin-bottom:5px;letter-spacing:-.01em;}
  .vt p{margin:0;font-size:14.3px;color:var(--muted);max-width:62ch;}

  .rows{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-bottom:16px;}
  .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;
    padding:8px 0;border-bottom:1px dotted var(--line2);}
  .r .k{font-size:13.5px;color:var(--muted);}
  .r .v{font-size:13.5px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .r .v small{display:block;font-size:10.5px;color:var(--faint);font-weight:500;}

  .subh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:9px;
    display:flex;align-items:center;gap:8px;}
  .subh .live-tag{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;
    background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);}

  /* Week forecast. Temperature, rainfall and the index each get their own
     visual channel - a plain number, a filled droplet, a tinted chip - so two
     days that differ never look alike. */
  .week{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;}
  .dy{background:var(--card);border:1px solid var(--line);border-radius:10px;
    overflow:hidden;text-align:center;}
  .dy .hd{padding:6px 4px 5px;border-bottom:1px solid var(--line);background:var(--soft);}
  .dy .dw{font-size:11.5px;font-weight:700;line-height:1.2;}
  .dy .dd{font-size:9.5px;color:var(--faint);font-family:var(--mono);}
  .dy .bd{padding:9px 5px 10px;}
  .dy .tp{font-size:17px;font-weight:700;line-height:1;letter-spacing:-.02em;}
  .dy .rain{display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:10.5px;font-family:var(--mono);color:var(--muted);margin-top:7px;}
  .dy .drop{width:8px;height:8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    flex-shrink:0;}
  .dy .chip{display:inline-block;margin-top:9px;padding:2px 9px;border-radius:999px;
    font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;}
  .dy.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}
  .dy.today .hd{background:var(--teal-w);}
  .dy .flag{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:800;margin-top:6px;line-height:1.25;}

  /* footfall from webcams */
  .foot{margin-top:16px;}
  .frow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;
    padding:9px 0;border-bottom:1px dotted var(--line2);}
  .frow:last-child{border-bottom:0;}
  .frow .fn{font-size:13.5px;font-weight:700;}
  .frow .fs{font-size:11.5px;color:var(--faint);margin-top:2px;}
  .frow .fv{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1;text-align:right;}
  .frow .fv small{display:block;font-size:11px;font-weight:600;letter-spacing:0;margin-top:3px;}
  .spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:6px;}
  .spark i{display:block;flex:1;min-width:2px;background:var(--teal);border-radius:1px 1px 0 0;opacity:.75;}
  .spark i.now{opacity:1;background:var(--teal-d);}

  /* past years */
  .hist{margin-top:16px;}
  .hrow{display:grid;grid-template-columns:44px 1fr auto;gap:11px;align-items:center;
    padding:7px 0;border-bottom:1px dotted var(--line2);}
  .hrow:last-child{border-bottom:0;}
  .hrow .yr{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);}
  .hrow.now .yr{color:var(--teal-d);}
  .hbar{height:9px;border-radius:5px;background:var(--inset);overflow:hidden;}
  .hbar>i{display:block;height:100%;border-radius:5px;}
  .hrow .hv{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;
    color:var(--muted);}
  .hrow .hv b{color:var(--ink);font-size:13px;}

  .outlook{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-top:14px;}
  .outlook h4{font-size:14px;margin:0 0 8px;font-weight:700;}
  .outlook p{font-size:13.8px;color:var(--muted);margin:0 0 9px;max-width:70ch;}
  .outlook p:last-child{margin-bottom:0;}
  .outlook b{color:var(--ink);font-weight:600;}
  .ol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .ol{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 12px;}
  .ol .t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:800;}
  .ol .v{font-size:15px;font-weight:700;margin-top:3px;}
  .ol .s{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px;}

  footer{margin-top:28px;padding-top:15px;border-top:1px solid var(--line);font-size:11.8px;color:var(--faint);line-height:1.7;}
  footer a{color:var(--teal-d);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  .skel{color:var(--faint);}

  @media (max-width:820px){ .week{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:720px){
    .facts{grid-template-columns:repeat(2,1fr);}
    .rows{grid-template-columns:1fr;}
    .verdict{flex-direction:column;gap:12px;}
    .ol-grid{grid-template-columns:1fr;}
    h1{font-size:26px;}
    .tab{font-size:12.5px;padding:7px 11px;}
  }

  /* data dates, shown up front so every figure can be judged by its age */
  .datebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .dchip{font-size:11.8px;line-height:1.35;border:1px solid var(--line);background:var(--card);
    border-radius:8px;padding:4px 9px;color:var(--muted);}
  .dchip b{color:var(--ink);font-weight:700;}
  .dchip.old{border-color:color-mix(in srgb,var(--amber) 55%,var(--line));
    background:color-mix(in srgb,var(--amber) 9%,var(--card));}
  .dchip.none{color:var(--faint);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:18px 20px;box-shadow:var(--sh);}
  .meta{font-size:12.3px;color:var(--faint);margin:0 0 12px;line-height:1.6;}
  .meta b{color:var(--muted);font-weight:700;}
  .meta a,.note a,footer a{color:var(--teal-d);}
  .note{font-size:12px;color:var(--faint);margin:11px 0 0;max-width:74ch;line-height:1.55;}
  .warn{font-size:12.6px;color:var(--amber);margin:6px 0 10px;line-height:1.5;}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.tb{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tb th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;
    text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .tb td{padding:7px 8px;border-bottom:1px dotted var(--line2);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .tb th:first-child,.tb td:first-child{text-align:left;padding-left:0;}
  .tb td:first-child{white-space:normal;min-width:120px;}
  .tb tr:last-child td{border-bottom:0;}
  .tb tr.total td{font-weight:700;border-top:1px solid var(--line2);}
  .tb td.bc{width:30%;min-width:70px;}
  .mbar{display:block;height:8px;border-radius:4px;background:var(--inset);overflow:hidden;}
  .mbar>i{display:block;height:100%;border-radius:4px;background:var(--teal);opacity:.8;}
  .tb .dim{color:var(--faint);font-weight:500;}
  .seg{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px;}
  .seg button{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--muted);
    font:inherit;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:7px;cursor:pointer;}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}
  .seg button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .nl{list-style:none;margin:0;padding:0;}
  .nl li{padding:10px 0;border-bottom:1px dotted var(--line2);}
  .nl li:last-child{border-bottom:0;}
  .nl .tt{font-size:14.4px;font-weight:600;line-height:1.42;overflow-wrap:anywhere;}
  .nl .tt a{color:var(--ink);text-decoration:none;}
  .nl .tt a:hover{color:var(--teal-d);text-decoration:underline;}
  .nl .nm{font-size:11.8px;color:var(--faint);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .tag{font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:5px;
    background:var(--inset);color:var(--muted);}
  .tag.off{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal-d);}

  @media (max-width:640px){ .tb .bc,.tb .opt{display:none;} }
  @media (max-width:480px){
    .tb th{white-space:normal;vertical-align:bottom;}
    .tb th,.tb td{padding-left:5px;padding-right:5px;font-size:12.5px;}
    .tb th{font-size:9.5px;}
    .tb td:first-child{min-width:92px;}
  }
  @media (max-width:560px){
    .card{padding:15px 14px;}
    .wrap{padding:20px 16px 48px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="lang" id="btnEn" aria-pressed="true">EN</button>
    <button class="lang" id="btnRu" aria-pressed="false">RU</button>
  </div>

  <header class="top">
    <div class="kicker" id="kicker"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="dateline"><span class="dot" id="statusDot"></span><span id="statusTxt"></span></div>
    <div class="datebar" id="dates"></div>
  </header>

  <section class="summary">
    <h2 id="sumH"></h2>
    <p id="sumP1"></p>
    <p id="sumP2"></p>
  </section>

  <div class="facts" id="facts"></div>

  <h3 class="sec" id="secArr"></h3>
  <p class="sub" id="subArr"></p>
  <div class="card">
    <div class="meta" id="arrMeta"></div>
    <div class="seg" id="arrSeg"></div>
    <div class="tw"><table class="tb" id="arrTbl"></table></div>
    <p class="note" id="arrNote"></p>
  </div>

  <h3 class="sec" id="secProv"></h3>
  <p class="sub" id="subProv"></p>
  <div class="card">
    <div class="meta" id="provMeta"></div>
    <div class="tw"><table class="tb" id="provTbl"></table></div>
    <p class="note" id="provNote"></p>
  </div>

  <h3 class="sec" id="secNews"></h3>
  <p class="sub" id="subNews"></p>
  <div class="card">
    <div class="meta" id="newsMeta"></div>
    <div class="seg" id="newsSeg"></div>
    <ul class="nl" id="newsList"></ul>
    <p class="note" id="newsNote"></p>
  </div>

  <h3 class="sec" id="secRegions"></h3>
  <p class="sub" id="subRegions"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="panel">
    <div class="verdict">
      <div class="vs">
        <div class="num" id="vNum">—</div>
        <div class="rail"><i id="vRail"></i></div>
        <div class="cap" id="vCap"></div>
      </div>
      <div class="vt"><div class="st" id="vSt"></div><p id="vTx"></p></div>
    </div>
    <div class="subh"><span id="pvH"></span></div>
    <div class="rows" id="rows"></div>
    <div class="subh"><span id="wkH"></span><span class="live-tag" id="wkLive"></span></div>
    <div class="week" id="week"></div>
    <div class="foot" id="foot" hidden>
      <div class="subh"><span id="ftH"></span><span class="live-tag" id="ftLive"></span></div>
      <div id="footfall"></div>
    </div>
    <div class="hist">
      <div class="subh"><span id="hiH"></span></div>
      <div id="history"></div>
    </div>
    <div class="outlook" style="margin-top:14px">
      <h4 id="olH"></h4>
      <p id="olP"></p>
      <div class="ol-grid" id="olGrid"></div>
    </div>
  </div>

  <footer>
    <span id="ftSrc"></span>
    <p style="margin:9px 0 0" id="ftDis"></p>
  </footer>
</div>

<script>
/* ---------------- config ---------------- */
const REGIONS=[
 {id:'bangkok',  en:'Bangkok',    ru:'Бангкок',   ap:'BKK·DMK', lat:13.69, lon:100.75, base:48, wsens:.15},
 {id:'pattaya',  en:'Pattaya',    ru:'Паттайя',   ap:'UTP·BKK', lat:12.93, lon:100.88, base:30, wsens:.45},
 {id:'phuket',   en:'Phuket',     ru:'Пхукет',    ap:'HKT',     lat:7.88,  lon:98.39,  base:42, wsens:.42},
 {id:'krabi',    en:'Krabi',      ru:'Краби',     ap:'KBV',     lat:8.09,  lon:98.91,  base:44, wsens:.44},
 {id:'samui',    en:'Samui',      ru:'Самуи',     ap:'USM',     lat:9.51,  lon:100.06, base:45, wsens:.42},
 {id:'chiangmai',en:'Chiang Mai', ru:'Чиангмай',  ap:'CNX',     lat:18.79, lon:98.98,  base:38, wsens:.30}
];

/* Measured data lives in tourism/official.json and tourism/news.json, written
   by the collectors with periods and publication dates. Nothing below is a
   hand-entered market figure: every number on the page comes from a dated file. */
const PROVINCES=[
 {id:'pattaya',  en:'Chonburi (incl. Pattaya)',  ru:'Чонбури (включая Паттайю)'},
 {id:'bangkok',  en:'Bangkok',                   ru:'Бангкок'},
 {id:'phuket',   en:'Phuket',                    ru:'Пхукет'},
 {id:'krabi',    en:'Krabi',                     ru:'Краби'},
 {id:'samui',    en:'Surat Thani (incl. Samui)', ru:'Сураттани (включая Самуи)'},
 {id:'chiangmai',en:'Chiang Mai',                ru:'Чиангмай'},
 {id:'thailand', en:'All Thailand',              ru:'Весь Таиланд', total:true}

let LANG=/^ru\b/i.test(navigator.language||'')?'ru':'en', CUR=1, DATA=null, FX=null, BUILT=null, HIST=null, FOOT=null, STATUS='loading';

/* ---------------- safe formatting ----------------
   Everything read from JSON is escaped before it reaches innerHTML:
   news titles come from third-party sites and are untrusted.        */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&Number.isFinite(v);
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const LOC=()=>LANG==='ru'?'ru-RU':'en-GB';
function safeUrl(u){
  if(typeof u!=='string')return null;
  try{const x=new URL(u);return x.protocol==='https:'||x.protocol==='http:'?x.href:null;}catch(e){return null;}
}
function link(text,url){
  const u=safeUrl(url);
  return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`:esc(text);
}
function num(v,d=0){return isNum(v)?v.toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d}):'—';}
function upTo(v,d=2){return isNum(v)?v.toLocaleString(LOC(),{maximumFractionDigits:d}):'—';}
function signed(v,d=1,unit='%'){
  if(!isNum(v))return '';
  const r=Math.round(v*10**d)/10**d;
  return (r>0?'+':r<0?'−':'')+Math.abs(r).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d})+unit;
}
function col(v){return !isNum(v)?'var(--faint)':v>0?'var(--green)':v<0?'var(--coral)':'var(--muted)';}
function chg(v,d=1,unit='%'){return isNum(v)?`<span style="color:${col(v)}">${signed(v,d,unit)}</span>`:'<span class="dim">—</span>';}
function compact(v){
  if(!isNum(v))return '—';
  return v>=1e6?(v/1e6).toLocaleString(LOC(),{maximumFractionDigits:2})+(LANG==='ru'?' млн':'M'):num(v);
}
function when(s){if(typeof s!=='string')return null;const d=new Date(s);return isNaN(d)?null:d;}
function dateText(d,time){
  if(!d)return '—';
  const o={timeZone:'Asia/Bangkok',day:'numeric',month:'short',year:'numeric'};
  if(time){o.hour='2-digit';o.minute='2-digit';}
  return d.toLocaleString(LOC(),o);
}
function ymd(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof s==='string'?s:'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12)):null;}
function dayText(s){const d=ymd(s);return d?d.toLocaleDateString(LOC(),{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'}):'—';}
function bkkDate(d){
  // YYYY-MM-DD in Bangkok, built from parts: locale date formats are not stable across browsers.
  const p={};
  new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(d).forEach(x=>{p[x.type]=x.value;});
  return `${p.year}-${p.month}-${p.day}`;
}
function ago(d){
  // Calendar days in Bangkok, the same count the morning brief prints.
  if(!d)return '';
  const t=T[LANG], n=Math.round((Date.parse(bkkDate(new Date()))-Date.parse(bkkDate(d)))/864e5);
  return n<=0?t.agoToday:n===1?t.ago1:t.agoN.replace('{n}',n);
}
function period(p){const m=/^(\d{4})-(\d{2})$/.exec(typeof p==='string'?p:'');return m?{y:+m[1],m:+m[2]}:null;}
function periodText(p){
  const x=period(p);
  return x?new Date(Date.UTC(x.y,x.m-1,1)).toLocaleDateString(LOC(),{timeZone:'UTC',month:'long',year:'numeric'}):'—';
}
function monthText(p){
  const x=period(p);
  return x?new Date(Date.UTC(x.y,x.m-1,1)).toLocaleDateString(LOC(),{timeZone:'UTC',month:'long'}):'—';
}
/* Calendar days in Bangkok from the last day of the period, as in the morning brief. */
function daysSinceEnd(p){const x=period(p);return x?Math.round((Date.parse(bkkDate(new Date()))-Date.UTC(x.y,x.m,0))/864e5):null;}
function statusText(s){const t=T[LANG];return s==='preliminary'?t.prelim:s==='revised'?t.revised:'—';}
function bkkToday(){return bkkDate(new Date());}
function topicName(k){
  const t=T[LANG], r=REGIONS.find(x=>x.id===k);
  return t.topics[k]||(r?r[LANG]:String(k));
}
function errorsFor(...names){
  const t=T[LANG], list=OFF&&Array.isArray(OFF.errors)?OFF.errors:[];
  return list.filter(e=>e&&names.includes(e.source)).map(e=>
    `<p class="warn">⚠ ${t.refreshFailed(esc(t.srcNames[e.source]),esc(dateText(when(e.at),true)),esc(e.error||'—'))}</p>`).join('');
}
function overdueFor(kind,p){
  const n=daysSinceEnd(p);
  return n!=null&&n>OVERDUE[kind]?`<p class="warn">⚠ ${T[LANG].overdue(n)}</p>`:'';
}
function blockMeta(b,url){
  const t=T[LANG], pub=when(b.published_at), got=when(b.retrieved_at);
  return [`<b>${esc(periodText(b.period))}</b>`, esc(statusText(b.status)),
    `${t.published} ${esc(dateText(pub))}${pub?` (${esc(ago(pub))})`:''}`,
    `${t.retrieved} ${esc(dateText(got,true))}`,
    link('MOTS',b.source_url||url)+(safeUrl(b.file_url)?' · '+link('XLSX',b.file_url):'')].join(' · ');
}
function occDelta(r){
  return isNum(r.occupancy_change_pp)?r.occupancy_change_pp
    :isNum(r.occupancy_pct)&&isNum(r.occupancy_prev_pct)?r.occupancy_pct-r.occupancy_prev_pct:null;
}
function marketKey(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'');}
function marketName(m){
  const known=KEY_MARKETS.find(k=>marketKey(k[0])===marketKey(m.name));
  if(LANG==='ru')return m.ru||(known?known[2]:m.name);
  return known?known[1]:m.name;
}

/* ---------------- data loading ----------------
   Primary source is data.json, rebuilt by the daily job.
   If it is missing, the page falls back to calling the open
   weather API directly so the forecast is never blank. The
   measured statistics have no such fallback: they are shown
   only from the collected, dated files.                    */
function fromOpenMeteo(w){
  const arr=Array.isArray(w)?w:[w], out={};
  REGIONS.forEach((r,i)=>{
    const d=arr[i].daily;
    out[r.id]=d.time.map((iso,j)=>({iso,
      tmax:Math.round(d.temperature_2m_max[j]),
      mm:d.precipitation_sum[j]??0,
      pop:d.precipitation_probability_max[j]??0}));
  });
  return out;
}
async function fetchDirect(){
  const lat=REGIONS.map(r=>r.lat).join(','), lon=REGIONS.map(r=>r.lon).join(',');
  const wxUrl=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
    `&daily=temperature_2m_max,precipitation_sum,precipitation_probability_max`+
    `&timezone=Asia%2FBangkok&forecast_days=8`;
  const [w,f]=await Promise.all([
    fetch(wxUrl).then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch(SRC.erapi).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  DATA=fromOpenMeteo(w);
  FX=f&&f.rates?f.rates:null;
  // The provider's own update time, not the moment the browser asked.
  FX_AT=f&&isNum(f.time_last_update_unix)?new Date(f.time_last_update_unix*1000).toISOString():null;
  BUILT=new Date().toISOString();
}
async function getJson(url){
  try{
    const r=await fetch(url+'?_='+Date.now(),{cache:'no-store'});
    const d=r.ok?await r.json():null;
    return d&&typeof d==='object'&&!Array.isArray(d)?d:null;
  }catch(e){return null;}
}
async function loadLive(){

/* ---------------- scoring ---------------- */
function scoreFor(region,mm,pop){
  const rain=Math.min(1,(mm/28)*0.75+(pop/100)*0.25);
  return Math.max(0,Math.min(100,Math.round(region.base*(1-rain*region.wsens))));
}
function tone(s){const t=T[LANG].tones;
  return s<24?[CL.coral,t[0]]:s<30?[CL.amber,t[1]]:s<45?[CL.grey,t[2]]:[CL.green,t[3]];}

function renderFootfall(rid){
  const t=T[LANG], box=$('#foot');
  // Legacy unreviewed detections and unavailable frames are not measurements.
  const valid=c=>c&&c.status==='ok'&&Number.isFinite(c.people)&&c.people>=0&&c.series_version;
  const rows=((FOOT&&FOOT.rows)||[]).filter(r=>Object.values(r.cams||{}).some(c=>c.region===rid&&valid(c)));
  if(!rows.length){ box.hidden=true; return; }
  box.hidden=false;
  const last=rows[rows.length-1], cams=Object.keys(last.cams||{}).filter(k=>last.cams[k].region===rid&&valid(last.cams[k]));
  const lastT=new Date(last.at);
  if(Date.now()-lastT>3*36e5){box.hidden=true;return;}
  const html=cams.map(slot=>{
    const cur=last.cams[slot], series=rows.slice(-24).map(r=>{
      const c=(r.cams||{})[slot];
      return valid(c)&&c.series_version===cur.series_version?c.people:null;
    });
    const mx=Math.max(...series,1);
    // same hour a week ago - the honest comparison for a daily rhythm
    const wk=rows.find(r=>Math.abs(new Date(r.at)-(lastT-7*864e5))<36e5);
    const old=wk&&wk.cams[slot];
    const prev=valid(old)&&old.series_version===cur.series_version?old.people:null;
    const d=prev!=null&&prev>0?Math.round((cur.people-prev)/prev*100):null;
    const dc=d==null?'var(--faint)':d>=0?'var(--green)':'var(--coral)';
    const dtxt=d==null?'—':(d>=0?'+':'')+d+'% '+t.ftVs;
    return `<div class="frow"><div>
        <div class="fn">${esc(cur.title||slot)}</div>
        <div class="fs">${t.ftAt} ${esc(lastT.toLocaleString(LOC(),{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}))}</div>
        <div class="spark">${series.map((v,i)=>`<i class="${i===series.length-1?'now':''}" style="height:${v===null?0:Math.max(2,Math.round(v/mx*100))}%;opacity:${v===null?0:1}"></i>`).join('')}</div>
      </div>
      <div class="fv">${num(cur.people)}<small style="color:${dc}">${esc(dtxt)}</small></div></div>`;
  }).join('');
  $('#footfall').innerHTML=html;
}

function renderHistory(rid, days){
  const t=T[LANG], box=$('#history');
  if(!HIST||!HIST.years){ box.innerHTML=`<p class="skel" style="margin:0;font-size:13px">${t.hiNone}</p>`; return; }

  const rows=[];
  if(days&&days.length){
    // Only complete days, so a missing forecast is not counted as a dry one.
    const w=days.slice(0,7).filter(d=>isNum(d.wx)&&isNum(d.mm));
    if(w.length) rows.push({year:new Date().getFullYear(), now:true,
      score:Math.round(w.reduce((a,b)=>a+b.wx,0)/w.length),
      mm:Math.round(w.reduce((a,b)=>a+b.mm,0)*10)/10,
      wet:w.filter(d=>d.mm>=15).length});
  }
  Object.keys(HIST.years).sort().reverse().forEach(y=>{
    const d=obj(HIST.years[y])[rid];
    if(d&&isNum(d.avg_score)) rows.push({year:y, score:d.avg_score, mm:d.mm_total, wet:d.wet_days});
  });
  if(!rows.length){ box.innerHTML=`<p class="skel" style="margin:0;font-size:13px">${t.hiNone}</p>`; return; }

  const top=Math.max(...rows.map(r=>r.score),1);
  box.innerHTML=rows.map(r=>{
    const [c]=tone(r.score);
    return `<div class="hrow${r.now?' now':''}">
      <span class="yr">${esc(r.year)}${r.now?'*':''}</span>
      <span class="hbar"><i style="width:${Math.round(r.score/top*100)}%;background:${c}"></i></span>
      <span class="hv"><b>${num(r.score)}</b> · ${upTo(r.mm,1)} ${t.rain} · ${num(r.wet)} ${t.hiWet}</span>
    </div>`;}).join('')
    +`<p style="font-size:11.5px;color:var(--faint);margin:9px 0 0">* ${t.hiNow}. ${t.hiNote}</p>`;
}

function renderRegion(){
  const t=T[LANG], r=REGIONS[CUR];
  renderProvinceRows(r);

  // Only days from today on: an old data.json must not pass yesterday off as today.
  const todayIso=bkkToday();
  const raw=DATA&&Array.isArray(DATA[r.id])?DATA[r.id].filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.iso)&&x.iso>=todayIso):[];
  if(!raw.length){
    $('#vNum').textContent='—'; $('#vNum').style.color=''; $('#vRail').style.width='0';
    $('#vSt').textContent=t.condToday; $('#vTx').textContent=DATA?t.wxStale:t.loading;

    $('#olP').textContent=''; $('#olGrid').innerHTML=''; renderHistory(r.id,null); renderFootfall(r.id); return;
  }

  const days=raw.map(x=>({iso:x.iso,dow:new Date(x.iso+'T00:00:00').getDay(),
      dd:x.iso.slice(8)+'.'+x.iso.slice(5,7),
      // Missing rain stays unknown: treating it as 0 mm would read as a dry day.
      tp:isNum(x.tmax)?x.tmax:null,mm:isNum(x.mm)?x.mm:null,pop:isNum(x.pop)?x.pop:0,
      score:isNum(x.score)?x.score:(isNum(x.mm)?scoreFor(r,x.mm,isNum(x.pop)?x.pop:0):null),
      // Weather term alone, to compare with the weather-only history.
      wx:isNum(obj(x.parts).weather)?x.parts.weather:(isNum(x.mm)?scoreFor(r,x.mm,isNum(x.pop)?x.pop:0):null),
      ev:x.event&&typeof x.event==='object'?(x.event[LANG]||null):null})).filter(x=>x.score!=null);
  if(!days.length){
    $('#vNum').textContent='—'; $('#vSt').textContent=t.condToday; $('#vTx').textContent=t.wxStale;
    $('#week').innerHTML=''; $('#olP').textContent=''; $('#olGrid').innerHTML=''; return;
  }

  const today=days[0], [tc,tl]=tone(today.score);
  $('#vNum').textContent=today.score; $('#vNum').style.color=tc;
  $('#vRail').style.width=today.score+'%'; $('#vRail').style.background=tc;
  $('#vSt').textContent=`${t.condToday}: ${tl.toLowerCase()}`;
  $('#vTx').textContent=t.wxToday(today.tp==null?'—':num(today.tp),today.mm==null?'—':upTo(today.mm,1),num(today.pop));

  $('#week').innerHTML=days.map((x,i)=>{
    const [c]=tone(x.score);
    // Droplet darkens with rainfall, independent of the score colour.
    const wet=Math.round(Math.min(1,x.mm/25)*100);
    const flag=i===0
      ? `<div class="flag" style="color:var(--teal-d)">${t.today}</div>`
      : x.ev ? `<div class="flag" style="color:var(--amber)">${esc(x.ev)}</div>` : '';
    return `<div class="dy${i===0?' today':''}">
      <div class="hd"><div class="dw">${t.days[x.dow]}</div><div class="dd">${x.dd}</div></div>
      <div class="bd">
        <div class="tp">${x.tp==null?'—':num(x.tp)}°</div>
        <div class="rain"><span class="drop" style="background:color-mix(in srgb,var(--teal) ${wet}%,var(--line2))"></span>${x.mm==null?'—':upTo(x.mm,1)}</div>
        <div class="chip" style="background:color-mix(in srgb,${c} 16%,transparent);color:${c}">${x.score}</div>
        ${flag}
      </div></div>`;}).join('');

  renderHistory(r.id, days);
  renderFootfall(r.id);

  /* week-ahead outlook, generated from the forecast */
  const fwd=days.slice(1);
  if(!fwd.length){ $('#olP').textContent=''; $('#olGrid').innerHTML=''; return; }
  const worst=fwd.reduce((a,b)=>b.score<a.score?b:a);
  const bestF=fwd.reduce((a,b)=>b.score>a.score?b:a);
  const avg=Math.round(fwd.reduce((s,x)=>s+x.score,0)/fwd.length);
  const [ac,al]=tone(avg);
  const evList=[...new Set(fwd.filter(x=>x.ev).map(x=>esc(x.ev)))];
  const wet=fwd.filter(x=>x.mm>=15).length;

  $('#olP').innerHTML = LANG==='en'
    ? `Over the next ${fwd.length} days the outdoor-conditions score averages <b>${avg}</b> (${al.toLowerCase()}). The best day is <b>${t.days[bestF.dow]} ${bestF.dd}</b> at ${bestF.score}, the weakest <b>${t.days[worst.dow]} ${worst.dd}</b> at ${worst.score}. ${wet?`Heavy rain is forecast on <b>${wet}</b> of them.`:'No heavy-rain days are forecast.'} ${evList.length?`Calendar: <b>${evList.join(', ')}</b>.`:`Calendar is clear — ${t.noEvent}.`}`
    : `На ближайшие ${fwd.length} дн. оценка условий на улице в среднем <b>${avg}</b> (${al.toLowerCase()}). Лучший день — <b>${t.days[bestF.dow]} ${bestF.dd}</b> с ${bestF.score}, худший — <b>${t.days[worst.dow]} ${worst.dd}</b> с ${worst.score}. ${wet?`Сильный дождь ожидается в <b>${wet}</b> из них.`:'Дней с сильным дождём не ожидается.'} ${evList.length?`Календарь: <b>${evList.join(', ')}</b>.`:`Календарь пуст — ${t.noEvent}.`}`;

  $('#olGrid').innerHTML=[
    [t.olBest,`${t.days[bestF.dow]} ${bestF.dd}`,`${bestF.score} / 100`,tone(bestF.score)[0]],
    [t.olWorst,`${t.days[worst.dow]} ${worst.dd}`,`${worst.score} / 100`,tone(worst.score)[0]],
    [t.olAvg,String(avg),al,ac]
  ].map(([a,b,c,colr])=>`<div class="ol"><div class="t">${a}</div>
    <div class="v" style="color:${colr}">${b}</div><div class="s">${c}</div></div>`).join('');
}

/* ---------------- init ---------------- */
$('#btnEn').addEventListener('click',()=>{LANG='en';render();});
$('#btnRu').addEventListener('click',()=>{LANG='ru';render();});
render();
loadLive();
loadMeasured();
</script>
</body>
</html>
