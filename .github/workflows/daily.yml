name: Daily data refresh

on:
  schedule:
    # 01:00 UTC = 08:00 in Bangkok
    - cron: "0 1 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data.json
        run: python3 scripts/build_data.py

      # Same week in past years, from the free weather archive.
      - name: Build history.json
        run: python3 scripts/build_history.py
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json history.json; then
            echo "data.json unchanged, nothing to commit"
          else
            git add data.json history.json
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            # The daily and weekly jobs can finish together; rebase onto
            # whichever pushed first instead of failing the run.
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
            done
          fi
