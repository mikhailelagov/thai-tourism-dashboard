name: Daily data refresh

on:
  schedule:
    # 01:45 UTC = 08:45 Bangkok; the report is also available with the Mac off.
    - cron: "45 1 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build data.json
        run: python3 scripts/build_data.py

      # Same week in past years, from the free weather archive.
      - name: Build history.json
        run: python3 scripts/build_history.py
        continue-on-error: true

      - name: Prepare the morning tourism report
        if: ${{ always() }}
        run: python3 scripts/morning_brief.py

      - name: Commit refreshed data
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json reports/
          if git diff --cached --quiet; then
            echo "data.json unchanged, nothing to commit"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            # The daily and weekly jobs can finish together; rebase onto
            # whichever pushed first instead of failing the run.
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi
