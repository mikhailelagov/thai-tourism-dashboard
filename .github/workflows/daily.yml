name: Daily tourism summary

on:
  schedule:
    # 01:00 UTC = 08:00 in Bangkok, so the summary lands in the morning
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data.json
        run: python3 scripts/build_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "data.json unchanged, nothing to commit"
          else
            git add data.json
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SUMMARY_LANG: ${{ vars.SUMMARY_LANG }}
        run: python3 scripts/send_telegram.py
