name: Hourly tourism observations

on:
  schedule:
    # Hourly, away from the busiest minute. GitHub may delay scheduled jobs.
    - cron: "17 * * * *"
  # Touching .run-footfall counts on demand, so a run can be triggered from git.
  push:
    branches: [main]
    paths: [".run-footfall", ".github/workflows/footfall.yml", "scripts/collect_tourism.py", "tourism/cameras.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: footfall
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect reviewed tourism source statuses
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: python3 scripts/collect_tourism.py

      - name: Save observations, including explicit gaps
        if: ${{ always() }}
        run: |
          test -f footfall.json || exit 1
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff cannot see a file that is still untracked,
          # so the very first run reported "unchanged" and committed nothing.
          git add footfall.json
          if git diff --cached --quiet -- footfall.json; then
            echo "footfall.json unchanged"
          else
            git commit -m "data: tourism observations $(date -u +%Y-%m-%dT%H:%M)"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main || exit 1
            done
            exit 1
          fi
