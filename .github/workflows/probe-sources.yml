name: Probe data sources (temporary)

# Checks that the new sources answer GitHub's runners, not only a Thai IP.
# Commits nothing; delete before merging.
on:
  push:
    branches: [fix/briefing-validity]
    paths: [".github/workflows/probe-sources.yml", "scripts/collect_*.py"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: What the DTAM collector sees on a runner
        run: |
          python3 - <<'PY'
          import importlib.util, re, traceback, urllib.parse
          from datetime import datetime, timedelta, timezone
          spec = importlib.util.spec_from_file_location("cn", "scripts/collect_news.py")
          cn = importlib.util.module_from_spec(spec); spec.loader.exec_module(cn)
          src = [s for s in cn.SOURCES if s["name"].startswith("DTAM")][0]
          cutoff = datetime.now(timezone.utc) - timedelta(days=10)
          after = (cutoff - timedelta(days=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
          q = {"after": after, "per_page": 100, "orderby": "date", "order": "desc",
               "_fields": "id,date_gmt,link,title", "search": src["search"], "page": 1}
          for label, url, accept in (("REST", src["endpoint"] + "?" + urllib.parse.urlencode(q), cn.JSON_ACCEPT),
                                     ("RSS", src["fallback_feed"], cn.XML_ACCEPT)):
              try:
                  body, headers = cn.fetch(url, accept)
                  head = re.sub(rb"[?&=]", b" ", body[:240])
                  print(label, headers.get("content-type"), len(body), head)
                  if label == "RSS":
                      print("entries", len(cn.feed_entries(body)))
              except Exception:
                  print(label, "failed")
                  traceback.print_exc()
          PY

      - name: Official statistics
        run: python3 scripts/collect_official.py || true
      - name: News
        run: python3 scripts/collect_news.py || true
      - name: Weather, holidays, ECB and FRED
        run: python3 scripts/build_data.py || true
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          o = json.load(open("tourism/official.json"))
          print("official errors:", o.get("errors"))
          for k in ("arrivals", "provinces", "bot"):
              print(k, (o.get(k) or {}).get("retrieved_at"))
          n = json.load(open("tourism/news.json"))
          for s in n["sources"]:
              print("news", s["name"], s["ok"], s["count"], s.get("error"))
          d = json.load(open("data.json"))
          print("data built_at", d.get("built_at"), "fx_time", d.get("fx_time"), "errors", d.get("errors"))
          PY
